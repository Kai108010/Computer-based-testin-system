<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>電腦答題系統</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; line-height: 1.6; padding: 20px; max-width: 800px; margin: auto; background-color: #f4f6f9; color: #333; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1 { color: #2c3e50; border-bottom: 3px solid #34495e; padding-bottom: 10px; margin-top: 0; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input[type="number"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn { padding: 12px 20px; font-size: 1.1em; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; width: 100%; font-weight: bold; margin-top: 10px; }
        .btn-primary { background: #3498db; color: white; }
        .btn-primary:hover { background: #2980b9; }
        .btn-danger { background: #e74c3c; color: white; margin-top: 20px; }
        .btn-danger:hover { background: #c0392b; }
        .btn-ready { background: #2ecc71; color: white; font-size: 1.3em; margin-top: 20px; }
        .btn-ready:hover { background: #27ae60; }
        .btn-secondary { background: #95a5a6; color: white; }
        .btn-secondary:hover { background: #7f8c8d; }
        
        /* 考試介面 */
        .sticky-header { position: sticky; top: 0; background: rgba(255,255,255,0.95); padding: 15px; border-bottom: 2px solid #ddd; display: flex; justify-content: space-between; align-items: center; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .timer { font-size: 1.8em; font-weight: bold; color: #e74c3c; }
        .question-box { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px dashed #ccc; }
        .q-title { font-size: 1.2em; font-weight: bold; margin-bottom: 10px; color: #2c3e50; }
        input[type="text"].ans-input { width: 100%; padding: 12px; font-size: 1.1em; border: 2px solid #bdc3c7; border-radius: 6px; transition: border 0.3s; }
        input[type="text"].ans-input:focus { border-color: #3498db; outline: none; }
        
        /* 成績單介面 */
        .score-display { text-align: center; font-size: 3em; font-weight: bold; margin: 20px 0; color: #2c3e50; }
        .score-goal-met { color: #2ecc71; }
        .score-goal-failed { color: #e74c3c; }
        .result-item { background: #fdfdfd; border: 1px solid #eee; border-left: 5px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 4px; }
        .result-item.perfect { border-left-color: #2ecc71; }
        .result-item.wrong { border-left-color: #e74c3c; background: #fffcfc; }
        .diff-text { background: #ffe6e6; color: #c0392b; padding: 2px 4px; border-radius: 3px; font-family: monospace; }
        .correct-text { background: #e6ffe6; color: #27ae60; padding: 2px 4px; border-radius: 3px; font-family: monospace; }
        .point-badge { float: right; font-weight: bold; font-size: 1.1em; }
    </style>
</head>
<body>

<div id="setup-screen" class="card">
    <h1>電腦答題系統</h1>
    <h2>檔案格式範例<h2>
    <h3>2+3=(題目)<h3>
    <h3>5(答案)<h3>
    <div class="form-group">
        <label>1. 匯入題庫 (.txt)</label>
        <input type="file" id="fileInput" accept=".txt">
    </div>
    <div class="form-group">
        <label>2. 測驗時間 (1 ~ 60 分鐘)</label>
        <input type="number" id="timeInput" min="1" max="60" value="10">
    </div>
    <div class="form-group">
        <label>3. 設定目標分數 (0 ~ 100)</label>
        <input type="number" id="goalInput" min="0" max="100" value="60">
    </div>
    <button class="btn btn-primary" onclick="prepareQuiz()">下一步</button>
</div>

<div id="ready-screen" class="card" style="display: none; text-align: center;">
    <h1>試題已準備完畢</h1>
    <p style="font-size: 1.2em;">總題數：<span id="ready-q-count">0</span> 題</p>
    <p style="font-size: 1.2em;">時間：<span id="ready-time">0</span> 分鐘</p>
    <p style="font-size: 1.2em;">目標：<span id="ready-goal">0</span> 分</p>
    <hr>
    <p style="color: #e74c3c; font-weight: bold;">評分規則：滿分 100。錯一字或標點扣 1 分，未作答該題 0 分。</p>
    <button class="btn btn-ready" onclick="startQuiz()">開始作答</button>
    <button class="btn btn-secondary" onclick="goBackToSetup()">返回重新設定</button>
</div>

<div id="quiz-screen" style="display: none;">
    <div class="sticky-header">
        <div style="font-size: 1.2em; font-weight: bold;">目標：<span id="nav-goal"></span> 分</div>
        <div class="timer" id="timer">00:00</div>
    </div>
    <div class="card" style="margin-top: 20px;">
        <div id="questions-container"></div>
        <button class="btn btn-danger" onclick="submitQuiz(true)">提早交卷</button>
    </div>
</div>

<div id="result-screen" class="card" style="display: none;">
    <h1>成績報告</h1>
    <div class="score-display" id="final-score">0</div>
    <div style="text-align: center; font-size: 1.2em; margin-bottom: 20px; font-weight: bold;" id="goal-result"></div>
    <div style="text-align: center; margin-bottom: 20px; color: #7f8c8d;" id="score-details"></div>
    <hr>
    <h3>答題分析</h3>
    <div id="analysis-container"></div>
    <button class="btn btn-primary" style="margin-top: 20px;" onclick="location.reload()">返回重新設定</button>
</div>

<script>
    let quizData = [];
    let timeLimitSeconds = 0;
    let goalScore = 60;
    let timerInterval;
    
    let basePointsPerQ = 0;
    let bonusPoints = 0;

    function getEditDistance(a, b) {
        if(a.length === 0) return b.length;
        if(b.length === 0) return a.length;
        let matrix = [];
        for(let i = 0; i <= b.length; i++) matrix[i] = [i];
        for(let j = 0; j <= a.length; j++) matrix[0][j] = j;
        for(let i = 1; i <= b.length; i++) {
            for(let j = 1; j <= a.length; j++) {
                if(b.charAt(i-1) === a.charAt(j-1)) {
                    matrix[i][j] = matrix[i-1][j-1];
                } else {
                    matrix[i][j] = Math.min(matrix[i-1][j-1] + 1, Math.min(matrix[i][j-1] + 1, matrix[i-1][j] + 1));
                }
            }
        }
        return matrix[b.length][a.length];
    }

    function goBackToSetup() {
        document.getElementById('ready-screen').style.display = 'none';
        document.getElementById('setup-screen').style.display = 'block';
    }

    function prepareQuiz() {
        const fileInput = document.getElementById('fileInput');
        const timeInput = parseInt(document.getElementById('timeInput').value);
        goalScore = parseInt(document.getElementById('goalInput').value);

        if (!fileInput.files[0]) {
            alert("請先上傳題庫檔案！");
            return;
        }
        if (isNaN(timeInput) || timeInput < 1 || timeInput > 60) {
            alert("請設定 1 到 60 分鐘之間的時間！");
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const lines = e.target.result.split(/\r?\n/).map(l => l.trim()).filter(l => l !== "");
            quizData = [];
            for (let i = 0; i < lines.length; i += 2) {
                if (lines[i+1]) {
                    quizData.push({ q: lines[i], a: lines[i+1] });
                }
            }

            if (quizData.length === 0) {
                alert("檔案格式有誤！請確保是一行題目、一行答案。");
                return;
            }

            quizData.sort(() => Math.random() - 0.5);

            timeLimitSeconds = timeInput * 60;
            
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('ready-screen').style.display = 'block';
            
            document.getElementById('ready-q-count').innerText = quizData.length;
            document.getElementById('ready-time').innerText = timeInput;
            document.getElementById('ready-goal').innerText = goalScore;
        };
        reader.readAsText(fileInput.files[0]);
    }

    function startQuiz() {
        document.getElementById('ready-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        document.getElementById('nav-goal').innerText = goalScore;

        const container = document.getElementById('questions-container');
        container.innerHTML = '';

        quizData.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'question-box';
            div.innerHTML = `
                <div class="q-title">${index + 1}. ${item.q}</div>
                <input type="text" class="ans-input" id="ans-${index}" placeholder="請輸入完整注釋（含標點）" autocomplete="off">
            `;
            container.appendChild(div);
        });

        startTimer();
    }

    function startTimer() {
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            timeLimitSeconds--;
            updateTimerDisplay();
            
            if (timeLimitSeconds <= 0) {
                clearInterval(timerInterval);
                alert("時間到！系統自動收卷。");
                submitQuiz(false);
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        let mins = Math.floor(timeLimitSeconds / 60);
        let secs = timeLimitSeconds % 60;
        document.getElementById('timer').innerText = 
            `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function submitQuiz(isManual) {
        if (isManual) {
            if (!confirm("確定要提早交卷嗎？")) return;
        }
        clearInterval(timerInterval);

        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        calculateAndRenderResult();
    }

    function calculateAndRenderResult() {
        const totalQ = quizData.length;
        basePointsPerQ = Math.floor(100 / totalQ);
        bonusPoints = 100 % totalQ;
        
        let totalScore = bonusPoints;
        const analysisContainer = document.getElementById('analysis-container');
        analysisContainer.innerHTML = '';

        quizData.forEach((item, index) => {
            const userAns = document.getElementById(`ans-${index}`).value.trim();
            const correctAns = item.a;
            
            let pointsEarned = 0;
            let isPerfect = false;
            let isUnanswered = false;
            let errorCount = 0;

            if (userAns === "") {
                isUnanswered = true;
                pointsEarned = 0;
            } else {
                errorCount = getEditDistance(correctAns, userAns);
                pointsEarned = Math.max(0, basePointsPerQ - errorCount);
                isPerfect = errorCount === 0;
            }

            totalScore += pointsEarned;

            const div = document.createElement('div');
            div.className = `result-item ${isPerfect ? 'perfect' : 'wrong'}`;
            
            let resultHTML = `
                <div class="point-badge ${isPerfect ? 'correct-text' : 'diff-text'}">得分：${pointsEarned} / ${basePointsPerQ}</div>
                <div style="font-weight: bold; margin-bottom: 5px;">${index + 1}. ${item.q}</div>
            `;

            if (isUnanswered) {
                resultHTML += `
                    <div style="margin-bottom: 5px;">標準答案：<span class="correct-text">${correctAns}</span></div>
                    <div style="font-size: 0.9em; color: #e74c3c; margin-top: 5px; font-weight: bold;">
                        狀態：未作答 (得 0 分)
                    </div>
                `;
            } else if (isPerfect) {
                resultHTML += `<div>你的答案：<span style="color: green;">${userAns}</span></div>`;
            } else {
                resultHTML += `
                    <div style="margin-bottom: 5px;">標準答案：<span class="correct-text">${correctAns}</span></div>
                    <div style="margin-bottom: 5px;">你的答案：<span class="diff-text">${userAns}</span></div>
                    <div style="font-size: 0.9em; color: #e74c3c; margin-top: 5px;">
                        判定：與標準答案相差 ${errorCount} 個字或標點 (本題滿分 ${basePointsPerQ} 分，扣 ${Math.min(errorCount, basePointsPerQ)} 分)
                    </div>
                `;
            }
            
            div.innerHTML = resultHTML;
            analysisContainer.appendChild(div);
        });

        const finalScoreEl = document.getElementById('final-score');
        finalScoreEl.innerText = totalScore + " 分";
        
        const goalResultEl = document.getElementById('goal-result');
        if (totalScore >= goalScore) {
            finalScoreEl.className = "score-display score-goal-met";
            goalResultEl.innerText = `恭喜達標！ (目標：${goalScore} 分)`;
        } else {
            finalScoreEl.className = "score-display score-goal-failed";
            goalResultEl.innerText = `未達標，請再接再厲。 (目標：${goalScore} 分)`;
        }

        document.getElementById('score-details').innerText = 
            `(計分方式：每題 ${basePointsPerQ} 分，共 ${totalQ} 題。系統送分：${bonusPoints} 分)`;
    }
</script>

</body>
</html>
